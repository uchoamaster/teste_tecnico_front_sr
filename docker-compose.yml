services:
  postgres:
    image: postgres:16-alpine
    container_name: ovgs-postgres
    environment:
      POSTGRES_DB: ovgs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ovgs']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: ovgs-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ovgs?schema=public
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:5173,http://localhost:4173
      JWT_SECRET: ovgs-jwt-local-secret
      JWT_EXPIRES_IN: 8h
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:3000
    container_name: ovgs-web
    depends_on:
      - api
    ports:
      - '4173:4173'

volumes:
  postgres_data: